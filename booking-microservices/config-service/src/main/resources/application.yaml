server:
  port: ${PORT:${SERVER_PORT:0}}

spring:
  cloud:
    config:
      server:
        git:
          default-label: main
          uri: https://github.com/veron-santiago/booking-microservices
          search-paths: booking-microservices/config-data
  application:
    name: config-service

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      default-zone: http://localhost:8761/eureka
    instance:
      instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
